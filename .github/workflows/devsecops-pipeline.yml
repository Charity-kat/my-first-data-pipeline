name: DevSecOps Data Pipeline CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run Unit Tests (Pytest)
        run: pytest

      - name: Run Security Audit (Bandit)
        run: bandit -r . -ll -s B101 -x ./venv

      - name: Build Docker Container Image
        run: docker build -t crypto-pipeline:latest .

      - name: Run Pipeline in Docker Container
        run: docker run --rm crypto-pipeline:latest






























